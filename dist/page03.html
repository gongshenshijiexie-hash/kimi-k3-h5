.page::after {
  content: "";
  position: absolute;
  z-index: 1;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(2, 10, 31, .54) 0%, rgba(2, 10, 31, .16) 25%, rgba(2, 7, 19, .08) 70%, rgba(2, 7, 19, .32) 100%);
}
.eyebrow {
  position: absolute;
  z-index: 3;
  top: 6%;
  left: 8%;
  display: flex;
  align-items: center;
  gap: .55em;
  margin: 0;
  color: #9adfff;
  font-size: clamp(18px, 3.2vw, 38px);
  font-weight: 600;
  line-height: 1;
  opacity: 0;
  animation: fade-in .45s ease-out .1s forwards;
}
.eyebrow::before {
  content: "";
  width: 1.25em;
  height: 3px;
  flex: none;
  background: #44caff;
  box-shadow: 0 0 10px rgba(68, 202, 255, .6);
}
h1 {
  position: absolute;
  z-index: 3;
  top: 11%;
  left: 8%;
  right: 8%;
  margin: 0;
  color: #f4fbff;
  font-size: clamp(36px, 7vw, 78px);
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -.03em;
  white-space: nowrap;
  opacity: 0;
  transform: translateY(12px);
  text-shadow: 0 3px 18px rgba(0, 0, 0, .68);
  animation: title-in .55s cubic-bezier(.2, .75, .2, 1) .2s forwards;
}
.meter {
  --load: 0deg;
  position: absolute;
  z-index: 3;
  width: 68%;
  aspect-ratio: 1 / 1;
  left: 50%;
  top: 48%;
  transform: translate(-50%, -50%) scale(.94);
  border-radius: 50%;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle, rgba(4, 16, 39, .88) 0 58%, transparent 59%),
    conic-gradient(from -90deg, #168cff 0deg, #55d9ff var(--load), rgba(154, 223, 255, .18) var(--load) 360deg);
  box-shadow: 0 0 44px rgba(22, 140, 255, .2);
  animation: meter-in .55s cubic-bezier(.2, .75, .2, 1) .3s forwards;
}
.meter::after {
  content: "";
  position: absolute;
  inset: 8%;
  border: 1px solid rgba(154, 223, 255, .3);
  border-radius: 50%;
  box-shadow: inset 0 0 28px rgba(22, 140, 255, .28), 0 0 18px rgba(68, 202, 255, .2);
}
.reading {
  position: relative;
  z-index: 1;
  width: 100%;
  text-align: center;
  text-shadow: 0 0 20px rgba(22, 140, 255, .72);
}
.load-label {
  display: block;
  margin-bottom: .2em;
  color: #e8f8ff;
  font-size: clamp(20px, 4vw, 46px);
  font-weight: 600;
  line-height: 1.15;
}
.value {
  display: flex;
  align-items: baseline;
  justify-content: center;
  color: #fff;
  font-size: clamp(74px, 18vw, 190px);
  font-weight: 800;
  line-height: .9;
  letter-spacing: -.07em;
}
.percent {
  margin-left: .06em;
  font-size: .45em;
  letter-spacing: 0;
}
.limit {
  display: block;
  margin-top: .45em;
  color: #44caff;
  font-size: clamp(24px, 4.5vw, 54px);
  font-weight: 650;
  line-height: 1.1;
  opacity: 0;
  transform: translateY(7px);
  animation: limit-in .45s ease-out 1.1s forwards;
}
.status {
  position: absolute;
  z-index: 3;
  left: 8%;
  right: 8%;
  bottom: 7%;
  padding: 1.15em 0 .25em;
  text-align: center;
  background: linear-gradient(180deg, rgba(2, 7, 19, 0), rgba(2, 7, 19, .55));
}
.status-primary {
  margin: 0;
  color: #fff;
  font-size: clamp(24px, 4.8vw, 56px);
  font-weight: 700;
  line-height: 1.2;
  white-space: nowrap;
  word-break: keep-all;
  opacity: 0;
  animation: fade-in .5s ease-out 2.2s forwards;
}
.status-secondary {
  margin: 12px 0 0;
  color: rgba(210, 230, 255, .72);
  font-size: clamp(16px, 3vw, 34px);
  line-height: 1.25;
  letter-spacing: .08em;
  white-space: nowrap;
  word-break: keep-all;
  opacity: 0;
  animation: fade-in .5s ease-out 2.45s forwards;
}
@keyframes fade-in { to { opacity: 1; } }
@keyframes title-in { to { opacity: 1; transform: translateY(0); } }
@keyframes meter-in { to { transform: translate(-50%, -50%) scale(1); } }
@keyframes limit-in { to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) {
  .eyebrow, h1, .meter, .limit, .status-primary, .status-secondary { animation-duration: .01ms; animation-delay: 0s; }
}
</style>
</head>
<body>
<main class="page">
  <div class="bg" aria-hidden="true"></div>
  <p class="eyebrow">真实需求</p>
  <h1>需求快速上涨</h1>
  <section class="meter" aria-label="算力负载 96% 接近上限">
    <div class="reading">
      <span class="load-label">算力负载</span>
      <strong class="value"><span id="load">0</span><span class="percent">%</span></strong>
      <span class="limit">接近上限</span>
    </div>
  </section>
  <footer class="status">
    <p class="status-primary">暂停新增消费者订阅</p>
    <p class="status-secondary">现有用户仍可正常使用</p>
  </footer>
</main>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const meter = document.querySelector(".meter");
  const output = document.getElementById("load");
  if (!meter || !output) return;

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    output.textContent = "96";
    meter.style.setProperty("--load", "345.6deg");
    return;
  }

  const delay = 300;
  const duration = 1800;
  const start = performance.now();
  const animate = (now) => {
    const progress = Math.min(1, Math.max(0, (now - start - delay) / duration));
    const eased = 1 - Math.pow(1 - progress, 3);
    const value = 96 * eased;
    output.textContent = String(Math.round(value));
    meter.style.setProperty("--load", `${value * 3.6}deg`);
    if (progress < 1) requestAnimationFrame(animate);
  };
  requestAnimationFrame(animate);
}, { once: true });
</script>
</body>
</html>
