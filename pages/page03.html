<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>火到算力<br>接近上限</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020713}body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#f4fbff}.page{position:relative;width:100vw;height:100svh;min-height:100vh;overflow:hidden;isolation:isolate;background:#020713}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3;filter:brightness(.46) saturate(1.08);animation:reveal 2s ease forwards}.shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(2,7,19,.84) 0%,rgba(2,7,19,.12) 42%,rgba(2,7,19,.78) 100%),radial-gradient(circle at 50% 50%,transparent 20%,rgba(1,5,15,.48) 100%)}header{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 4.3vh);left:7.2vw;right:7.2vw}.label{display:inline-flex;align-items:center;gap:7px;color:#55d9ff;font-size:clamp(15px,4vw,23px);font-weight:700;letter-spacing:.13em;opacity:0;animation:up .7s .5s ease forwards}.label:before{content:"";width:22px;height:3px;background:#168cff;box-shadow:0 0 12px #168cff}h1{font-size:clamp(39px,11.5vw,66px);line-height:1.12;letter-spacing:-.045em;margin:12px 0 5px;text-shadow:0 3px 20px #020713;opacity:0;transform:translateY(20px);animation:up .9s 5.8s cubic-bezier(.2,.8,.2,1) forwards}.eyebrow{font-size:clamp(14px,3.7vw,21px);color:#b7d8e9;letter-spacing:.09em;opacity:0;animation:up .7s 6.4s ease forwards}.visual{position:absolute;left:5vw;right:5vw;top:34%;height:44%;display:grid;place-items:center}footer{position:absolute;left:7vw;right:7vw;bottom:calc(env(safe-area-inset-bottom) + 4vh);font-size:clamp(22px,6.2vw,34px);font-weight:750;line-height:1.3;text-align:center;text-shadow:0 2px 18px #020713;opacity:0;animation:up .8s 7.2s ease forwards}footer:before{content:"";display:block;width:42px;height:3px;margin:0 auto 12px;background:#55d9ff;box-shadow:0 0 15px #168cff}.chip{font-size:clamp(60px,20vw,110px);font-weight:900;font-style:italic;text-shadow:0 0 18px #168cff,0 0 45px #168cff;opacity:0;animation:pop 1.2s 2s ease forwards}.ring{position:absolute;border:2px solid #55d9ff;border-radius:50%;opacity:0;animation:ring 1.6s 3s ease-out forwards}.r1{width:40vw;height:40vw}.r2{width:66vw;height:66vw;animation-delay:3.4s}.beam{position:absolute;width:2px;height:55%;background:linear-gradient(transparent,#55d9ff,transparent);transform:rotate(55deg);opacity:0;animation:flash 1.2s 4s ease forwards}.b2{transform:rotate(-55deg);animation-delay:4.3s}.orb{width:min(66vw,360px);aspect-ratio:1;border:2px solid #55d9ff;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(3,21,48,.66);box-shadow:inset 0 0 50px #168cff66,0 0 40px #168cff55;transform:scale(.2);opacity:0;animation:pop 1.2s 1.5s ease forwards}.orb strong{font-size:clamp(62px,19vw,106px);line-height:1}.orb em{font-size:.38em;font-style:normal}.orb span{font-size:24px}.skills,.tags{position:absolute;bottom:-2%;display:flex;gap:2.5vw}.skills b,.tags b{padding:10px 12px;border:1px solid #55d9ff;border-radius:6px;background:#061328dd;font-size:clamp(15px,4vw,22px);opacity:0;animation:up .6s 3.2s ease forwards}.skills b:nth-child(2),.tags b:nth-child(2){animation-delay:3.7s}.skills b:nth-child(3),.tags b:nth-child(3){animation-delay:4.2s}.notice{position:absolute;top:-5%;padding:8px 20px;border:1px solid #168cff;border-radius:8px;background:#061328ee;text-align:center;font-size:24px;opacity:0;animation:up .7s 1.2s ease forwards}.notice small{font-size:15px}.gauge{width:min(60vw,330px);aspect-ratio:1;border:14px solid #122a46;border-radius:50%;display:grid;place-content:center;text-align:center;box-shadow:0 0 30px #168cff66;background:#031024cc;position:relative;opacity:0;animation:pop .8s 2s ease forwards}.gauge:before{content:"";position:absolute;inset:-14px;border:14px solid transparent;border-top-color:#55d9ff;border-right-color:#168cff;border-bottom-color:#ff9d42;border-radius:50%;transform:rotate(-45deg);animation:meter 2s 2.5s ease forwards}.gauge strong{font-size:64px}.gauge small{font-size:28px}.gauge span{font-size:16px}.paused{position:absolute;bottom:-5%;padding:15px 18px;border:1px solid #55d9ff;border-radius:8px;background:#061328ee;font-size:20px;opacity:0;animation:up .7s 5s ease forwards}.paused b{margin-left:15px;color:#55d9ff}.turn{position:absolute;top:-4%;text-align:center;font-size:22px;opacity:0;animation:up .8s 1.4s ease forwards}.turn strong{font-size:38px;color:#ffd08b}.fork{position:absolute;bottom:3%;left:4%;right:4%;display:flex;justify-content:space-between;align-items:end}.fork span{font-size:30px;font-weight:800;color:#ffd08b;opacity:0;animation:up .7s 4s ease forwards}.fork span:last-child{color:#7de7ff;animation-delay:4.5s}.fork small{display:block;font-size:17px;color:white}.fork i{position:absolute;left:50%;bottom:0;width:3px;height:160px;background:linear-gradient(#fff,#ffd08b);transform-origin:bottom;transform:rotate(-38deg) scaleY(0);animation:road 1.3s 2.5s ease forwards}.fork i:after{content:"";position:absolute;width:3px;height:160px;background:linear-gradient(#fff,#55d9ff);transform-origin:bottom;transform:rotate(76deg)}.cards{display:grid;grid-template-columns:1fr 1fr;width:100%;gap:2vw}.cards section{min-height:310px;padding:18px 12px;text-align:center;border:1px solid #44617b;background:rgba(3,13,28,.8);opacity:0;transform:translateX(-50px);animation:leftin .9s 1.6s ease forwards}.cards section:last-child{border-color:#55d9ff;transform:translateX(50px);animation-name:rightin;animation-delay:2.3s}.cards .ico{font-size:60px;color:#55d9ff}.cards h2{font-size:clamp(22px,6vw,34px)}.cards p{font-size:clamp(15px,4.2vw,22px);line-height:1.8}.network{position:relative;width:85vw;height:34vh;border:1px solid #168cff88;border-radius:50%;box-shadow:inset 0 0 55px #168cff55;background:rgba(2,16,35,.45);opacity:0;animation:pop 1s 1.4s ease forwards}.network strong{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;color:#55d9ff}.network i{position:absolute;width:14px;height:14px;background:#55d9ff;border-radius:50%;box-shadow:0 0 18px #55d9ff;opacity:0;animation:flash .6s 2.5s ease forwards}.network i:nth-child(1){left:20%;top:30%}.network i:nth-child(2){left:70%;top:20%;animation-delay:3s}.network i:nth-child(3){left:80%;top:65%;animation-delay:3.5s}.network i:nth-child(4){left:35%;top:75%;animation-delay:4s}.network i:nth-child(5){left:50%;top:15%;animation-delay:4.5s}.tags{bottom:-12%}.sides{display:grid;grid-template-columns:1fr 1fr;gap:5vw;width:100%}.sides section{min-height:210px;padding:22px 8px;display:grid;place-content:center;text-align:center;background:rgba(20,5,10,.82);border:1px solid #ff754f;opacity:0;animation:leftin .8s 1.5s ease forwards}.sides section:last-child{background:rgba(2,15,38,.82);border-color:#168cff;animation-name:rightin;animation-delay:2.2s}.sides section div{font-size:65px;color:#ff8c69}.sides section:last-child div{color:#55d9ff}.sides b{font-size:clamp(17px,4.7vw,25px);line-height:1.5}.balance{position:absolute;bottom:-10%;text-align:center;opacity:0;animation:up .8s 4.2s ease forwards}.balance i{display:block;width:160px;height:4px;background:linear-gradient(90deg,#ff754f,#fff,#168cff);transform:rotate(-8deg);animation:balance 2s 4.5s ease forwards}.balance strong{display:block;margin-top:12px;font-size:24px}@keyframes reveal{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:scale(1)}}@keyframes up{to{opacity:1;transform:translateY(0)}}@keyframes pop{70%{opacity:1;transform:scale(1.07)}to{opacity:1;transform:scale(1)}}@keyframes ring{from{opacity:.8;transform:scale(.3)}to{opacity:.3;transform:scale(1)}}@keyframes flash{to{opacity:.85}}@keyframes meter{from{transform:rotate(-220deg)}to{transform:rotate(65deg)}}@keyframes road{to{transform:rotate(-38deg) scaleY(1)}}@keyframes leftin{to{opacity:1;transform:translateX(0)}}@keyframes rightin{to{opacity:1;transform:translateX(0)}}@keyframes balance{25%{transform:rotate(9deg)}50%{transform:rotate(-5deg)}to{transform:rotate(0)}}@media(max-height:700px){header{top:calc(env(safe-area-inset-top) + 2.5vh)}h1{font-size:clamp(34px,10vw,52px)}.visual{top:32%;height:45%}footer{font-size:21px;bottom:calc(env(safe-area-inset-bottom) + 2.5vh)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-delay:0s!important;animation-duration:.01s!important}}
</style></head><body><main class="page meter" aria-label="火到算力接近上限"><img class="bg" src="../page03.png" alt=""><div class="shade"></div><header><div class="label">真实需求</div><h1>火到算力<br>接近上限</h1><div class="eyebrow">需求快速上涨</div></header><div class="visual"><div class="notice">48小时<br><small>需求快速上涨</small></div><div class="gauge"><div class="gfill"></div><strong>92<small>%</small></strong><span>算力接近上限</span></div><div class="paused">暂停新增消费者订阅 <b>Ⅱ</b></div></div><footer>暂停新增消费者订阅</footer></main></body></html>
